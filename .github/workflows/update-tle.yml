# ISS の軌道データ(TLE)を CelesTrak から 6 時間ごとに取得して iss.txt を更新する
name: Update ISS TLE

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download TLE
        run: |
          curl -sf "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE" -o iss.tmp
          grep -q "^1 25544" iss.tmp && grep -q "^2 25544" iss.tmp
          tr -d '\r' < iss.tmp > iss.txt
          rm iss.tmp

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iss.txt
          git diff --cached --quiet || git commit -m "Update ISS TLE"
          git push
